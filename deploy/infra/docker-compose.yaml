# Shared infrastructure for every project on the VDS. Lives in /srv/infra on the server.
#   cp .env.example .env   # fill in the values
#   docker compose up -d
#
# Networks are created here with fixed names, projects attach to them as `external`:
#   proxy - Caddy <-> project frontends/APIs that must be reachable from the internet
#   db    - PostgreSQL <-> project backends

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is not set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    # Bound to localhost only: not reachable from the internet, but available
    # through an SSH tunnel for GUI clients (ssh -L 5432:localhost:5432 deploy@server).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  proxy:
    name: proxy
  db:
    name: db
