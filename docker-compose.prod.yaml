# Production compose for the VDS. The CI pipeline copies it to /srv/apexrate/docker-compose.yaml.
# Images come from GHCR; nothing is built on the server.
# Required on the server:
#   - /srv/apexrate/.env (see deploy/apexrate.env.example)
#   - the shared infra stack from deploy/infra running: it owns the `proxy` and `db` networks,
#     Caddy and the PostgreSQL instance shared by all projects.

services:
  backend:
    image: ghcr.io/sinonaz/apexrate-backend:${TAG:-latest}
    container_name: apexrate-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Own role and database in the shared PostgreSQL, created by deploy/infra/scripts/create-db.sh.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is not set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is not set}
      COINGECKO_API_URL: ${COINGECKO_API_URL:-https://api.coingecko.com/api/v3/}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:?COINGECKO_API_KEY is not set}
      FIAT_API_URL: ${FIAT_API_URL:-https://open.er-api.com/v6/}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - db

  frontend:
    image: ghcr.io/sinonaz/apexrate-frontend:${TAG:-latest}
    container_name: apexrate-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # No published ports: Caddy reaches this container over the `proxy` network.
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
  db:
    external: true
